openapi: 3.0.1

info:
  title: API de fondos de inversión
  version: 0.1.0
  description: |
    Contrato HTTP mínimo para consultar gestoras, fondos y versiones de KID.

    La base de datos distingue fondo y clase de fondo. En esta API, cada fondo
    consultable se identifica por el ISIN de su clase, que es el identificador
    utilizado por `GET /fondos/{isin}`.

servers:
  - url: /
    description: Servidor actual

security: []

tags:
  - name: Sistema
  - name: Gestoras
  - name: Fondos
  - name: KID

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Comprobar el estado de la API
      operationId: obtenerEstado
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: La API está disponible
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstadoServicio"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /gestoras:
    get:
      tags: [Gestoras]
      summary: Listar gestoras
      description: Devuelve las gestoras ordenadas por nombre y código.
      operationId: listarGestoras
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/TamanoPagina"
      responses:
        "200":
          description: Página de gestoras
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaGestoras"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "429":
          $ref: "#/components/responses/DemasiadasPeticiones"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /fondos:
    get:
      tags: [Fondos]
      summary: Listar fondos
      description: |
        Devuelve una fila por clase identificada mediante ISIN. El resultado se
        ordena por nombre del producto e ISIN para que la paginación sea estable.
      operationId: listarFondos
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/TamanoPagina"
        - $ref: "#/components/parameters/Gestora"
        - $ref: "#/components/parameters/IsinConsulta"
        - $ref: "#/components/parameters/NombreFondo"
      responses:
        "200":
          description: Página de fondos
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaFondos"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "429":
          $ref: "#/components/responses/DemasiadasPeticiones"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /fondos/{isin}:
    get:
      tags: [Fondos]
      summary: Obtener el detalle de un fondo por ISIN
      operationId: obtenerFondo
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IsinRuta"
      responses:
        "200":
          description: Detalle del fondo y datos de su KID más reciente
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FondoDetalle"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "429":
          $ref: "#/components/responses/DemasiadasPeticiones"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /kids:
    get:
      tags: [KID]
      summary: Listar versiones de KID
      description: |
        Permite filtrar por gestora, ISIN y fecha del documento. Las versiones
        se ordenan por fecha descendente, ISIN y SHA-256 del documento.
      operationId: listarKids
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/TamanoPagina"
        - $ref: "#/components/parameters/Gestora"
        - $ref: "#/components/parameters/IsinConsulta"
        - $ref: "#/components/parameters/FechaDocumento"
      responses:
        "200":
          description: Página de versiones de KID
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaKids"
        "422":
          $ref: "#/components/responses/ErrorValidacion"
        "429":
          $ref: "#/components/responses/DemasiadasPeticiones"
        "500":
          $ref: "#/components/responses/ErrorInterno"

components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Identificador de trazabilidad proporcionado por el cliente. Si no se
        envía, la API genera uno y siempre lo devuelve en la respuesta.
      schema:
        $ref: "#/components/schemas/CorrelationId"

    Pagina:
      name: pagina
      in: query
      required: false
      description: Número de página, empezando en 1.
      schema:
        type: integer
        minimum: 1
        default: 1

    TamanoPagina:
      name: tamano_pagina
      in: query
      required: false
      description: Número máximo de elementos devueltos.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Gestora:
      name: gestora
      in: query
      required: false
      description: Código estable de la gestora.
      schema:
        $ref: "#/components/schemas/CodigoGestora"

    IsinConsulta:
      name: isin
      in: query
      required: false
      description: ISIN exacto de la clase del fondo.
      schema:
        $ref: "#/components/schemas/Isin"

    IsinRuta:
      name: isin
      in: path
      required: true
      description: ISIN de la clase del fondo.
      schema:
        $ref: "#/components/schemas/Isin"

    NombreFondo:
      name: nombre
      in: query
      required: false
      description: Texto que debe aparecer en el nombre del producto.
      schema:
        type: string
        minLength: 1
        maxLength: 200

    FechaDocumento:
      name: fecha
      in: query
      required: false
      description: Fecha exacta de validez del KID.
      schema:
        type: string
        format: date

  headers:
    CorrelationId:
      description: Identificador utilizado para correlacionar los logs de la petición.
      required: true
      schema:
        $ref: "#/components/schemas/CorrelationId"

  responses:
    NoEncontrado:
      description: El recurso solicitado no existe
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ErrorValidacion:
      description: Los parámetros de la petición no son válidos
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    DemasiadasPeticiones:
      description: Se ha superado el límite de peticiones permitido
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
        Retry-After:
          description: Segundos que se recomienda esperar antes de reintentar.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ErrorInterno:
      description: Error técnico no esperado
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    CorrelationId:
      type: string
      description: Identificador utilizado para correlacionar una petición y sus logs.
      minLength: 1
      maxLength: 128
      example: 8f142b1c-c07b-4b73-9597-45ec0ee03716

    Isin:
      type: string
      description: Código ISIN de doce caracteres.
      pattern: "^[A-Z]{2}[A-Z0-9]{9}[0-9]$"
      example: ES0123456789

    CodigoGestora:
      type: string
      description: Identificador legible y estable de la gestora.
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      minLength: 1
      maxLength: 80
      example: bestinver

    EstadoServicio:
      type: object
      additionalProperties: false
      required: [estado, servicio, version]
      properties:
        estado:
          type: string
          enum: [ok]
        servicio:
          type: string
          example: api-fondos
        version:
          type: string
          example: 0.1.0

    Gestora:
      type: object
      additionalProperties: false
      required: [codigo, nombre]
      properties:
        codigo:
          $ref: "#/components/schemas/CodigoGestora"
        nombre:
          type: string
          minLength: 1
          maxLength: 200
          example: Bestinver

    FondoBase:
      type: object
      required:
        - isin
        - nombre_producto
        - nombre_clase
        - gestora
        - fecha_ultimo_kid
        - sri
      properties:
        isin:
          $ref: "#/components/schemas/Isin"
        nombre_producto:
          type: string
          minLength: 1
          maxLength: 300
          example: Bestinfond
        nombre_clase:
          type: string
          nullable: true
          maxLength: 200
          example: Clase C
        gestora:
          $ref: "#/components/schemas/Gestora"
        fecha_ultimo_kid:
          description: Fecha del KID válido más reciente, si está disponible.
          type: string
          nullable: true
          format: date
          example: "2026-11-19"
        sri:
          description: Indicador resumido de riesgo del KID más reciente.
          type: integer
          nullable: true
          minimum: 1
          maximum: 7
          example: 4

    FondoResumen:
      allOf:
        - $ref: "#/components/schemas/FondoBase"

    FondoDetalle:
      allOf:
        - $ref: "#/components/schemas/FondoBase"
        - type: object
          required:
            - periodo_mantenimiento_anios
            - gastos_corrientes_pct
            - costes_entrada_pct
            - costes_salida_pct
          properties:
            periodo_mantenimiento_anios:
              description: Período de mantenimiento recomendado, en años.
              type: number
              nullable: true
              minimum: 0
              example: 5
            gastos_corrientes_pct:
              description: Gastos corrientes anuales expresados como porcentaje.
              type: number
              nullable: true
              minimum: 0
              example: 1.78
            costes_entrada_pct:
              description: Costes de entrada expresados como porcentaje.
              type: number
              nullable: true
              minimum: 0
              example: 0
            costes_salida_pct:
              description: Costes de salida expresados como porcentaje.
              type: number
              nullable: true
              minimum: 0
              example: 0

    KidVersion:
      type: object
      additionalProperties: false
      required:
        - isin
        - nombre_producto
        - nombre_clase
        - gestora
        - fecha_documento
        - sri
        - periodo_mantenimiento_anios
        - gastos_corrientes_pct
        - costes_entrada_pct
        - costes_salida_pct
        - documento_sha256
      properties:
        isin:
          $ref: "#/components/schemas/Isin"
        nombre_producto:
          type: string
          minLength: 1
          maxLength: 300
          example: Bestinfond
        nombre_clase:
          type: string
          nullable: true
          maxLength: 200
          example: Clase C
        gestora:
          $ref: "#/components/schemas/Gestora"
        fecha_documento:
          type: string
          nullable: true
          format: date
          example: "2026-11-19"
        sri:
          type: integer
          minimum: 1
          maximum: 7
          example: 4
        periodo_mantenimiento_anios:
          type: number
          nullable: true
          minimum: 0
          example: 5
        gastos_corrientes_pct:
          type: number
          nullable: true
          minimum: 0
          example: 1.78
        costes_entrada_pct:
          type: number
          nullable: true
          minimum: 0
          example: 0
        costes_salida_pct:
          type: number
          nullable: true
          minimum: 0
          example: 0
        documento_sha256:
          type: string
          description: Huella SHA-256 del PDF del que procede esta versión.
          pattern: "^[a-f0-9]{64}$"
          example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    Paginacion:
      type: object
      additionalProperties: false
      required: [pagina, tamano_pagina, total]
      properties:
        pagina:
          type: integer
          minimum: 1
          example: 1
        tamano_pagina:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          description: Número total de elementos que cumplen los filtros.
          example: 37

    RespuestaGestoras:
      type: object
      additionalProperties: false
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: "#/components/schemas/Gestora"
        paginacion:
          $ref: "#/components/schemas/Paginacion"

    RespuestaFondos:
      type: object
      additionalProperties: false
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: "#/components/schemas/FondoResumen"
        paginacion:
          $ref: "#/components/schemas/Paginacion"

    RespuestaKids:
      type: object
      additionalProperties: false
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: "#/components/schemas/KidVersion"
        paginacion:
          $ref: "#/components/schemas/Paginacion"

    DetalleError:
      type: object
      additionalProperties: false
      required: [campo, mensaje]
      properties:
        campo:
          type: string
          description: Ruta del parámetro o campo incorrecto.
          example: query.pagina
        mensaje:
          type: string
          example: Debe ser mayor o igual que 1.

    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, correlation_id]
      properties:
        codigo:
          type: string
          description: Código estable y procesable por el cliente.
          pattern: "^[A-Z][A-Z0-9_]*$"
          example: PARAMETRO_NO_VALIDO
        mensaje:
          type: string
          description: Descripción legible del error.
          example: Uno o varios parámetros no son válidos.
        correlation_id:
          $ref: "#/components/schemas/CorrelationId"
        detalles:
          type: array
          items:
            $ref: "#/components/schemas/DetalleError"
