name: Manage frontend service in dev

run-name: ${{ inputs.action == 'start' && 'Start frontend in dev' || 'Stop frontend in dev' }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action to perform on the ECS Express service
        required: true
        type: choice
        options:
          - start
          - stop
      confirm_stop:
        description: Confirm the intentional interruption of the public frontend
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: "065451207233"
  AWS_REGION: eu-west-3
  TF_STATE_BUCKET: pipeline-fondos-terraform-state-065451207233
  TERRAFORM_VERSION: "1.15.8"

jobs:
  manage:
    name: Manage ECS Express frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: publish-frontend-dev
      cancel-in-progress: false

    steps:
      - name: Require the main branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "${WORKFLOW_REF}" != "refs/heads/main" ]; then
            echo "This workflow must be run from the main branch" >&2
            exit 1
          fi

      - name: Confirm requested action
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM_STOP: ${{ inputs.confirm_stop }}
        run: |
          if [ "${ACTION}" = "stop" ] && [ "${CONFIRM_STOP}" != "true" ]; then
            echo "Stopping the public frontend requires confirm_stop" >&2
            exit 1
          fi

      - name: Require deployment role variable
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "${AWS_DEPLOY_ROLE_ARN}" ]; then
            echo "Repository variable AWS_DEPLOY_ROLE_ARN is required" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: frontend-control-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Resolve latest published frontend image
        id: image
        run: |
          terraform -chdir=infra/environments/dev/frontend init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}"

          repository_name=$(terraform -chdir=infra/environments/dev/frontend output -raw repository_name)
          repository_url=$(terraform -chdir=infra/environments/dev/frontend output -raw repository_url)
          image_digest=$(aws ecr describe-images \
            --repository-name "${repository_name}" \
            --filter tagStatus=TAGGED \
            --query "reverse(sort_by(imageDetails,&imagePushedAt))[0].imageDigest" \
            --output text)

          if [[ ! "${image_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ECR did not return a valid digest for the latest tagged image" >&2
            exit 1
          fi

          {
            echo "reference=${repository_url}@${image_digest}"
            echo "digest=${image_digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Initialize frontend service state
        run: |
          terraform -chdir=infra/environments/dev/frontend-service init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Start frontend service
        if: inputs.action == 'start'
        id: start
        env:
          FRONTEND_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          terraform -chdir=infra/environments/dev/frontend-service plan \
            -input=false \
            -var="frontend_image=${FRONTEND_IMAGE}" \
            -out=start.tfplan
          terraform -chdir=infra/environments/dev/frontend-service apply \
            -input=false \
            start.tfplan

          service_endpoint=$(terraform -chdir=infra/environments/dev/frontend-service output -raw service_endpoint)
          service_arn=$(terraform -chdir=infra/environments/dev/frontend-service output -raw service_arn)

          {
            echo "endpoint=${service_endpoint}"
            echo "service_arn=${service_arn}"
          } >> "${GITHUB_OUTPUT}"

      - name: Smoke-test Streamlit
        if: inputs.action == 'start'
        env:
          SERVICE_ENDPOINT: ${{ steps.start.outputs.endpoint }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 5 \
            "${SERVICE_ENDPOINT%/}/_stcore/health"

      - name: Stop frontend service
        if: inputs.action == 'stop'
        env:
          FRONTEND_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          terraform -chdir=infra/environments/dev/frontend-service plan \
            -destroy \
            -input=false \
            -var="frontend_image=${FRONTEND_IMAGE}" \
            -out=stop.tfplan
          terraform -chdir=infra/environments/dev/frontend-service apply \
            -input=false \
            stop.tfplan

      - name: Start summary
        if: inputs.action == 'start'
        env:
          FRONTEND_IMAGE: ${{ steps.image.outputs.reference }}
          SERVICE_ARN: ${{ steps.start.outputs.service_arn }}
          SERVICE_ENDPOINT: ${{ steps.start.outputs.endpoint }}
        run: |
          {
            echo "## Frontend started"
            echo
            echo "- Image: ${FRONTEND_IMAGE}"
            echo "- ECS service: ${SERVICE_ARN}"
            echo "- Endpoint: ${SERVICE_ENDPOINT}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Stop summary
        if: inputs.action == 'stop'
        env:
          FRONTEND_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          {
            echo "## Frontend stopped"
            echo
            echo "- Last available image: ${FRONTEND_IMAGE}"
            echo "- ECR, API, artifacts and Terraform backend remain available."
            echo "- The next frontend deployment to main will recreate the service."
          } >> "${GITHUB_STEP_SUMMARY}"
