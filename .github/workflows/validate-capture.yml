name: Validate fund capture

on:
  pull_request:
    paths:
      - ".github/workflows/validate-capture.yml"
      - "Dockerfile.scraper*"
      - "webscrapper/**"
      - "tests/webscrapper/**"
      - "infra/environments/dev/capture*/**"
      - "infra/environments/dev/storage/**"
      - "infra/modules/container_registry/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-capture.yml"
      - "Dockerfile.scraper*"
      - "webscrapper/**"
      - "tests/webscrapper/**"
      - "infra/environments/dev/capture*/**"
      - "infra/environments/dev/storage/**"
      - "infra/modules/container_registry/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv python install 3.14
      - run: uv sync --locked --group dev --group scraping
      - run: uv run --locked --group dev --group scraping ruff check webscrapper tests/webscrapper
      - run: uv run --locked --group dev --group scraping pytest -q tests/webscrapper
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/environments/dev/storage init -backend=false -input=false
      - run: terraform -chdir=infra/environments/dev/storage validate
      - run: terraform -chdir=infra/environments/dev/storage test
      - run: terraform -chdir=infra/modules/container_registry init -backend=false -input=false
      - run: terraform -chdir=infra/modules/container_registry test
      - run: terraform -chdir=infra/environments/dev/capture-registry init -backend=false -input=false
      - run: terraform -chdir=infra/environments/dev/capture-registry validate
      - run: terraform -chdir=infra/environments/dev/capture init -backend=false -input=false
      - run: terraform -chdir=infra/environments/dev/capture validate
      - run: terraform -chdir=infra/environments/dev/capture test
      - run: docker buildx build --platform linux/arm64 --provenance=false --load -f Dockerfile.scraper -t pipeline-fondos-scraper:test .
